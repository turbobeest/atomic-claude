[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atomic-claude"
version = "2.0.0"
description = "Python SDLC pipeline with phased orchestration, LLM routing, memory, and agent-driven tasks"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "anthropic>=0.18.0,<1.0.0",
    "boto3>=1.34.0,<2.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "click>=8.1.0,<9.0.0",
    "rich>=13.7.0,<14.0.0",
    "textual>=1.0.0,<2.0.0",
    "aiohttp>=3.9.0,<4.0.0",
    "fastapi>=0.109.0,<1.0.0",
    "uvicorn>=0.27.0,<1.0.0",
    "falkordb>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<8.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-mock>=3.12.0,<4.0.0",
    "black>=24.0.0,<25.0.0",
    "pylint>=3.0.0,<4.0.0",
    "mypy>=1.8.0,<2.0.0",
    "flake8>=7.0.0,<8.0.0",
    "isort>=5.13.0,<6.0.0",
    "types-requests>=2.31.0",
    "boto3-stubs[bedrock-runtime]>=1.34.0",
]

[project.scripts]
atomic-claude = "main:cli"

[tool.setuptools.packages.find]
include = ["core*", "phases*", "orchestration*", "agents*", "skills*"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
