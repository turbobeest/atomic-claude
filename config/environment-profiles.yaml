# Environment Profiles for Atomic Claude Skill System
# Set once at phase 0. Propagates through install, graph, and runtime.
# Cannot be changed mid-session without explicit re-initialization.

profiles:

  air-gapped:
    description: "No internet. No SaaS. No external calls. Local-only skills."
    allow_internet: false
    allow_saas: false
    acceptable_risk_levels: ["None", "Low"]
    skill_install_strategy: "local-bundle-only"
    blocked_skill_ids: []

  sensitive:
    description: "Internet allowed for install only. No SaaS integrations. No high-risk skills."
    allow_internet: true
    allow_saas: false
    acceptable_risk_levels: ["None", "Low"]
    skill_install_strategy: "verified-sources-only"
    blocked_skill_ids: []

  standard:
    description: "Full internet. SaaS integrations with approval. All risk levels with review."
    allow_internet: true
    allow_saas: true
    acceptable_risk_levels: ["None", "Low", "Medium"]
    skill_install_strategy: "tiered-review"
    blocked_skill_ids: []

  unrestricted:
    description: "Development/lab environment. All skills, all risk levels."
    allow_internet: true
    allow_saas: true
    acceptable_risk_levels: ["None", "Low", "Medium", "High"]
    skill_install_strategy: "install-all"
    blocked_skill_ids: []
