[pytest]
# Pytest configuration for atomic-claude2

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum Python version
minversion = 3.9

# Add project root to Python path
pythonpath = .

# Coverage options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov=core
    --cov=phases
    --cov=orchestration
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-branch

# Markers for test categories
markers =
    unit: Unit tests for individual functions/classes
    integration: Integration tests for phase orchestrators
    e2e: End-to-end tests for full pipeline
    uat: User acceptance tests
    slow: Tests that take significant time
    llm: Tests that require LLM API access
    fileio: Tests that perform file I/O

# Ignore paths
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    .outputs
    .state
    .logs
    archive
    __pycache__

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (in seconds)
timeout = 300

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
